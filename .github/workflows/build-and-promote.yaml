name: Build, Push and Promote

on:
  push:
    branches: [ main ]

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set short SHA as tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-mgmt-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/user-mgmt-service:latest

      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: sidardnli-blip/user-mgmt-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops-repo

      - name: Update image tag in values.yaml
        run: |
          cd ops-repo
          sed -i "s|backend:.*|backend: ${{ secrets.DOCKERHUB_USERNAME }}/user-mgmt-service:${{ steps.vars.outputs.tag }}|" values.yaml
          cat values.yaml

      - name: Commit and push change to ops repo
        run: |
          cd ops-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add values.yaml
          git commit -m "Promote backend image to ${{ steps.vars.outputs.tag }}" || echo "No changes to commit"
          git push