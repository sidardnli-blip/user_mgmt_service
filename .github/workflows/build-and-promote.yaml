name: Build, Push and Promote

# Zentrale Pipeline fuer BEIDE Services:
#  - Push in diesem Repo   -> baut user-mgmt-service und module-service
#  - repository_dispatch   -> wird vom module_service Repo ausgeloest
#  - workflow_dispatch     -> manueller Start ueber den Actions Tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ module-service-push ]

env:
  MODULE_SERVICE_REPO: sidardnli-blip/module_service
  OPS_REPO: sidardnli-blip/user-mgmt-ops

jobs:
  build-user-mgmt-service:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set short SHA as tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-mgmt-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/user-mgmt-service:latest

  # Aufgabe 6: das Image des module_service wird von derselben Pipeline gebaut,
  # versioniert (Git Short SHA des module_service Repos) und publiziert.
  build-module-service:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout module_service repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULE_SERVICE_REPO }}
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: module_service

      - name: Set short SHA as tag
        id: vars
        working-directory: module_service
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: module_service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/module-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/module-service:latest

  # GitOps: neue Image-Tags ins Ops Repo schreiben -> ArgoCD deployt automatisch
  promote:
    runs-on: ubuntu-latest
    needs: [ build-user-mgmt-service, build-module-service ]
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPS_REPO }}
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: ops-repo

      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in values.yaml
        working-directory: ops-repo
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_TAG: ${{ needs.build-user-mgmt-service.outputs.tag }}
          MODULE_TAG: ${{ needs.build-module-service.outputs.tag }}
        run: |
          yq -i '.images.backend = strenv(DOCKERHUB_USERNAME) + "/user-mgmt-service:" + strenv(BACKEND_TAG)' values.yaml
          yq -i '.images.moduleService = strenv(DOCKERHUB_USERNAME) + "/module-service:" + strenv(MODULE_TAG)' values.yaml
          cat values.yaml

      - name: Commit and push change to ops repo
        working-directory: ops-repo
        env:
          BACKEND_TAG: ${{ needs.build-user-mgmt-service.outputs.tag }}
          MODULE_TAG: ${{ needs.build-module-service.outputs.tag }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add values.yaml
          git commit -m "Promote user-mgmt-service:${BACKEND_TAG} and module-service:${MODULE_TAG}" || echo "No changes to commit"
          git pull --rebase
          git push
