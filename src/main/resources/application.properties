spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}
# --- Aufgabe 1: Observability -------------------------------------------------
# Management-Endpunkte laufen auf einem eigenen Port (8081) und sind dadurch
# nicht ueber den Ingress von aussen erreichbar. Prometheus scrapt sie im Cluster.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Histogramm-Buckets -> erlaubt Perzentile (Response Time) in Prometheus/Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
management.observations.key-values.application=user-mgmt-service

# --- Aufgabe 6: Kommunikation mit dem module_service --------------------------
module-service.base-url=${MODULE_SERVICE_BASE_URL:http://module-service:8000}
module-service.connect-timeout=${MODULE_SERVICE_CONNECT_TIMEOUT:2s}
module-service.read-timeout=${MODULE_SERVICE_READ_TIMEOUT:3s}
module-service.retry.max-attempts=${MODULE_SERVICE_RETRY_MAX_ATTEMPTS:3}
module-service.retry.wait-duration=${MODULE_SERVICE_RETRY_WAIT_DURATION:200ms}
module-service.circuit-breaker.failure-rate-threshold=${MODULE_SERVICE_CB_FAILURE_RATE:50}
module-service.circuit-breaker.sliding-window-size=${MODULE_SERVICE_CB_WINDOW_SIZE:10}
module-service.circuit-breaker.minimum-number-of-calls=${MODULE_SERVICE_CB_MIN_CALLS:5}
module-service.circuit-breaker.wait-duration-in-open-state=${MODULE_SERVICE_CB_OPEN_WAIT:20s}
module-service.circuit-breaker.permitted-number-of-calls-in-half-open-state=${MODULE_SERVICE_CB_HALF_OPEN_CALLS:3}
# HikariCP: Pool-Groesse an das DigitalOcean-Verbindungslimit anpassen
spring.datasource.hikari.maximum-pool-size=18
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
